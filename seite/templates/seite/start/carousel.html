{% load seite %}{% if greeting %}
{% if greeting.gallery|length > 1 %}
<section class="begruessung begruessung-bilder">{% include "seite/karussell.html" with bilder=greeting.gallery %}</section>
{% else %}
{% lokal site greeting.image.url as bild %}
{% if bild %}<section class="begruessung begruessung-bilder"><figure class="titelbild"><img src="{{ bild }}" alt="{{ greeting.image.alt }}"{% if greeting.image.width %} width="{{ greeting.image.width }}" height="{{ greeting.image.height }}"{% endif %}>{% if greeting.image.caption %}<figcaption>{{ greeting.image.caption }}</figcaption>{% endif %}</figure></section>{% endif %}
{% endif %}
{% endif %}
